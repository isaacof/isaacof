  <!-- texto -->
  <rect x="64" y="64" width="30" height="4" rx="2" fill="url(#accent)"/>
  <text x="106" y="70" fill="#9fb0c6" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="3.4">CYBERSECURITY / SOC / AI AUTOMATION</text>

  <text x="64" y="156" fill="#f4f4f0" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="800" letter-spacing="-2">ISAAC SILVA</text>
  <text x="66" y="196" fill="#b8c2d1" font-family="Arial, Helvetica, sans-serif" font-size="20">Hands-on labs, detection engineering and automation.</text>

  <text x="66" y="250" fill="#e5e7eb" font-family="Arial, Helvetica, sans-serif" font-size="14" letter-spacing="2.4">LEARN  →  BUILD  →  TEST  →  DOCUMENT</text>
  <text x="66" y="276" fill="#6b7a90" font-family="Arial, Helvetica, sans-serif" font-size="13">github.com/isaacof</text>
